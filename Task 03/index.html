<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Akun Facebook</title>
</head>
<body>

    <h1>Buat akun Facebook</h1>
    
    <p>Facebook membantu Anda terhubung dan berbagi dengan orang-orang dalam kehidupan Anda.</p>

    <form>
        <label for="firstName">Nama Depan:</label>
        <input type="text" id="firstName" name="firstName" required><br><br>
        <label for="lastName">Nama Belakang:</label>
        <input type="text" id="lastName" name="lastName"><br><br>
    </form>

<table>
    <label> Tanggal Lahir:</label>
    <select name="day" id="day">
        <option value="">Hari</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="17">17</option>
        <option value="18">18</option>
        <option value="19">19</option>
        <option value="20">20</option>
        <option value="21">21</option>
        <option value="22">22</option>
        <option value="23">23</option>
        <option value="24">24</option>
        <option value="25">25</option>
        <option value="26">26</option>
        <option value="27">27</option>
        <option value="28">28</option>
        <option value="29">29</option>
        <option value="30">30</option>
        <option value="31">31</option>
    </select>

    <select name="month" id="month">
        <option value="">Bulan</option>
        <option value="1">Januari</option>
        <option value="2">Februari</option>
        <option value="3">Maret</option>
        <option value="4">April</option>
        <option value="5">Mei</option>
        <option value="6">Juni</option>
        <option value="7">Juli</option>
        <option value="8">Agustus</option>
        <option value="9">September</option>
        <option value="10">Oktober</option>
        <option value="11">November</option>
        <option value="12">Desember</option>
    </select>

    <select name="year" id="year">
        <option value="">Tahun</option>
        <!-- Options for years (example: 1900-2023) -->
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017">2017</option>
        <option value="2016">2016</option>
        <option value="2015">2015</option>
        <option value="2014">2014</option>
        <option value="2013">2013</option>
        <option value="2012">2012</option>
        <option value="2011">2011</option>
        <option value="2010">２０１０</option>
    </select>
</table><br><br>

<table>
    <label> Jenis Kelamin:</label>
        <select name="gender" id="gender">
            <option value="">Pilih Jenis Kelamin</option>
            <option value="male">Laki-laki</option>
            <option value="female">Perempuan</option>
        </select>
</table><br><br>

<label for="number">Nomor Ponsel:</label>
<input type="number" id="number" name="number"
            type="number"
            placeholder="+628..."><br><br>

<label for="email">Alamat Email:</label>
<input type="email" id="email" name="email"
            placeholder="Masukkan alamat email><br><br>

<label for="password">Kata Sandi:</label>
<input type="password" id="password" name="password"
            placeholder="Masukkan kata sandi"
            required><br><br>
</body>
</html>
