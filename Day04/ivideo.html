<!DOCTYPE html>
<html lang="id"> <!--Barisan kode berbahasa inggris-->
<head>
    <meta charset="UTF-8"> <!--Menentukan karakter yang digunakan -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Menentukan tampilan viewport -->
    <title>Website Video</title> <!--Judul halaman-->
</head>
<body>

    <h1>Video Contoh</h1> <!--Judul utama-->

    <iframe width="560" height="315" 
        src="https://www.youtube.com/embed/3LDiHGpj5mI" <!--URL video YouTube yang akan ditampilkan-->
        title="YouTube video player" <!--Judul video YouTube-->
        frameborder="0" <!--Border frame-->
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"  <!--Izin untuk video YouTube-->
        allowfullscreen> <!--Izin untuk menampilkan video dalam mode fullscreen-->
    </iframe> <!--Frame untuk menampilkan video YouTube-->

</body>
</html>
